[project]
site_name = "The Principles of Diffusion Models"
site_description = "An unofficial, chapter-by-chapter web edition of The Principles of Diffusion Models, based on arXiv:2510.21890v3."
site_author = "Chieh-Hsin Lai, Yang Song, Dongjun Kim, Yuki Mitsufuji, Stefano Ermon"
site_url = "https://slayerwalt.github.io/principles-of-diffusion-models/"
repo_url = "https://github.com/slayerwalt/principles-of-diffusion-models"
repo_name = "slayerwalt/principles-of-diffusion-models"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
copyright = "Original work © the authors · <a href=\"https://creativecommons.org/licenses/by-nc-nd/4.0/\">CC BY-NC-ND 4.0</a> · Unofficial web edition"
extra_css = ["assets/stylesheets/book.css"]
extra_javascript = [
  "assets/javascripts/mathjax.js",
  "assets/vendor/mathjax/tex-mml-chtml.js",
]
nav = [
  { "About this edition" = "index.md" },
  { "Book contents" = "en/book-outline.md" },
  { "1 · Deep Generative Modeling" = [
    { "Chapter introduction" = "en/chapters/01-deep-generative-modeling/index.md" },
    { "1.1 What is Deep Generative Modeling?" = "en/chapters/01-deep-generative-modeling/01-what-is-deep-generative-modeling.md" },
    { "1.2 Prominent Deep Generative Models" = "en/chapters/01-deep-generative-modeling/02-examples.md" },
    { "1.3 Taxonomy of Modeling" = "en/chapters/01-deep-generative-modeling/03-taxonomy.md" },
    { "1.4 Closing Remarks" = "en/chapters/01-deep-generative-modeling/04-summary.md" },
    { "Chapter references" = "en/chapters/01-deep-generative-modeling/references.md" },
  ] },
  { "2 · Variational Perspective" = [
    { "Chapter introduction" = "en/chapters/02-variational-perspective/index.md" },
    { "2.1 Variational Autoencoder" = "en/chapters/02-variational-perspective/01-variational-autoencoder.md" },
    { "2.2 Variational Perspective: DDPM" = "en/chapters/02-variational-perspective/02-ddpm.md" },
    { "2.3 Closing Remarks" = "en/chapters/02-variational-perspective/03-closing-remarks.md" },
    { "Chapter references" = "en/chapters/02-variational-perspective/references.md" },
  ] },
  { "3 · Score-Based Perspective" = [
    { "Chapter introduction" = "en/chapters/03-score-based-perspective/index.md" },
    { "3.1 Energy-Based Models" = "en/chapters/03-score-based-perspective/01-energy-based-models.md" },
    { "3.2 From Energy-Based to Score-Based Models" = "en/chapters/03-score-based-perspective/02-score-based-models.md" },
    { "3.3 Denoising Score Matching" = "en/chapters/03-score-based-perspective/03-denoising-score-matching.md" },
    { "3.4 Noise Conditional Score Networks" = "en/chapters/03-score-based-perspective/04-noise-conditional-score-networks.md" },
    { "3.5 Comparing NCSN and DDPM" = "en/chapters/03-score-based-perspective/05-comparison.md" },
    { "3.6 Closing Remarks" = "en/chapters/03-score-based-perspective/06-closing-remarks.md" },
    { "Chapter references" = "en/chapters/03-score-based-perspective/references.md" },
  ] },
  { "4 · Score SDE Framework" = [
    { "Chapter introduction" = "en/chapters/04-score-sde-framework/index.md" },
    { "4.1 Score SDE: Its Principles" = "en/chapters/04-score-sde-framework/01-score-sde-principles.md" },
    { "4.2 Matching Marginals" = "en/chapters/04-score-sde-framework/02-matching-marginals.md" },
    { "4.3 Training and Sampling" = "en/chapters/04-score-sde-framework/03-training-and-sampling.md" },
    { "4.4 Instantiations of SDEs" = "en/chapters/04-score-sde-framework/04-sde-instantiations.md" },
    { "4.5 Accumulated Perturbation Kernels" = "en/chapters/04-score-sde-framework/05-accumulated-perturbation-kernels.md" },
    { "4.6 Fokker–Planck and Reverse-Time SDEs" = "en/chapters/04-score-sde-framework/06-fokker-planck-and-reverse-sde.md" },
    { "4.7 Closing Remarks" = "en/chapters/04-score-sde-framework/07-closing-remarks.md" },
    { "Chapter references" = "en/chapters/04-score-sde-framework/references.md" },
  ] },
  { "A First Operational View (pending)" = "en/foundations/operational-view.md" },
  { "5 · Flow-Based Perspective (pending)" = "en/chapters/05-flow-based-perspective/index.md" },
  { "6 · A Unified and Systematic Lens (pending)" = "en/chapters/06-unified-perspective/index.md" },
  { "7 · Diffusion Models and Optimal Transport (pending)" = "en/chapters/07-optimal-transport/index.md" },
  { "9 · Numerical Solvers (pending)" = "en/chapters/09-numerical-solvers/index.md" },
  { "10 · Distillation-Based Methods (pending)" = "en/chapters/10-distillation/index.md" },
  { "11 · Learning Fast Generators (pending)" = "en/chapters/11-fast-generators/index.md" },
  { "A · Differential Equations (pending)" = "en/appendices/a-differential-equations/index.md" },
  { "B · Density Evolution (pending)" = "en/appendices/b-density-evolution/index.md" },
  { "C · Itô’s Calculus (pending)" = "en/appendices/c-ito-calculus/index.md" },
  { "D · Supplementary Materials and Proofs (pending)" = "en/appendices/d-supplementary-proofs/index.md" },
  { "Source and attribution" = "en/about.md" },
  { "中文 · 翻译计划" = "zh-CN/index.md" },
]

[project.theme]
variant = "modern"
language = "en"
font = false
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.footer",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
sane_lists = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.superfences = {}
